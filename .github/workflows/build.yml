# Bauen und testen auf Windows – derselbe Weg wie lokal (build.ps1).
#
# Actions über den Commit gepinnt, nicht über den Tag: Ein umgehängter Tag könnte sonst
# fremden Code in den Lauf bringen (OWASP A08, Supply Chain). Hashes am 2026-10-18 per
# „git ls-remote“ gelesen: checkout v4.2.2, upload-artifact v4.6.2.
#
# Nicht geprüft: Dieser Workflow ist noch nie gelaufen (das Repo hatte beim Schreiben
# keinen Remote). Ob die Tastatur-Probe ohne interaktiven Desktop eine Konsole bekommt,
# ist offen – deshalb continue-on-error.

name: Bauen und testen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Bauen und Unit-Tests (check, configure, build, test)
        shell: pwsh
        run: ./build.ps1

      - name: Tastatur-Probe in echter Konsole
        shell: pwsh
        continue-on-error: true
        run: ctest --test-dir out/rel -C Release -L integration --output-on-failure

      - name: LichtDuell.exe ablegen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: LichtDuell-windows-x64
          path: out/rel/bin/Release/LichtDuell.exe
          if-no-files-found: error
